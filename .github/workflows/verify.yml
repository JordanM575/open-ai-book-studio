name: verify

# The gates, in the order a person runs them: the unit layer, the builds, then the checks that only
# fail with a real window, a real browser and a second process.
#
# The live provider check is deliberately absent. It needs keys and costs money, so it is run by a
# person against a temporary copy of the sample, not by a runner on every push.

# Run by hand until a Linux run has been watched passing. The gates are proven locally today
# (`bun run verify`); a workflow that has never run green should not mark every public push.
on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck, tests and builds
        run: bun run verify

      - name: Coverage floor
        run: bun run coverage

  e2e:
    # The end-to-end checks drive a real Electron window, so they need a display.
    #
    # This job passed on macOS first. Its first Linux runs failed at launch on Electron's sandbox
    # helper, which the step below now sets up. It stays allowed to fail until someone has watched it
    # pass on Linux and said so.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install the browser the checks drive
        run: bunx playwright install --with-deps chromium firefox webkit

      # Electron refuses to start when its sandbox helper is not owned by root with the setuid bit,
      # which is how a fresh runner leaves it. Give it the helper's required owner and mode instead of
      # turning the sandbox off.
      - name: Fetch Electron and set up its sandbox helper
        run: |
          node apps/desktop/node_modules/electron/install.js
          sandbox="$(find node_modules -path '*/electron/dist/chrome-sandbox' -type f | head -n 1)"
          test -n "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"

      - name: Run the end-to-end checks under a virtual display
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" bun run e2e

      # When a check fails the smoke writes a screenshot and its console log to a temporary folder. Keep them,
      # so a failure that only shows on Linux can be looked at instead of guessed.
      - name: Keep the smoke failure screenshot and console log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: |
            /tmp/ai-book-studio-smoke-*/smoke-failure.png
            /tmp/ai-book-studio-smoke-*/smoke-console.log
          if-no-files-found: ignore
          retention-days: 7
