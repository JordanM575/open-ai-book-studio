<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Book Studio — caption cards</title>
    <link rel="stylesheet" href="../../packages/ui/src/styles/tokens.generated.css" />
    <style>
      /* The studio's type scale at film size: one factor for a 1920×1080 frame. */
      :root { --film-scale: 1.5; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
      body {
        font-family: var(--font-ui);
        color: var(--foreground);
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }
      body.preview { background: var(--ambient-base); }
      .card { position: absolute; inset: 0; display: none; }
      .card.active { display: block; }
      [data-reveal] { opacity: 0; }

      /* The app's .window-wash and .glass-strong recipes (packages/ui/src/styles/base.css). */
      .wash {
        background:
          radial-gradient(55% 60% at 0% 0%, var(--ambient-1) 0%, transparent 70%),
          radial-gradient(50% 55% at 100% 0%, var(--ambient-2) 0%, transparent 70%),
          radial-gradient(55% 60% at 100% 100%, var(--ambient-3) 0%, transparent 72%),
          radial-gradient(50% 55% at 0% 100%, var(--ambient-4) 0%, transparent 72%),
          radial-gradient(28% 36% at 46% 58%, var(--ambient-2) 0%, transparent 70%),
          radial-gradient(24% 30% at 70% 30%, var(--ambient-1) 0%, transparent 70%),
          var(--ambient-base);
      }
      .glass-strong {
        background: var(--glass-strong);
        box-shadow:
          inset 0 1px 0 0 var(--glass-specular),
          inset 0 -1px 0 0 var(--glass-rim-low),
          0 0 0 0.5px var(--glass-outline),
          var(--elevation-glass);
      }

      /* Event tag: the top-left corner is the quietest part of the workspace. */
      .tag {
        position: absolute; left: 96px; top: 32px;
        display: inline-flex; align-items: center;
        gap: calc(var(--space-2) * var(--film-scale));
        padding: calc(var(--space-1) * var(--film-scale)) calc(var(--space-4) * var(--film-scale));
        border-radius: var(--corner-full);
        font-size: calc(var(--text-headline-size) * var(--film-scale));
        line-height: calc(var(--text-headline-leading) * var(--film-scale));
        font-weight: var(--text-headline-weight);
        letter-spacing: calc(var(--text-headline-tracking) * var(--film-scale));
      }
      .tag .dot {
        width: calc(var(--space-2) * var(--film-scale)); height: calc(var(--space-2) * var(--film-scale));
        border-radius: var(--corner-full); background: var(--muted-foreground);
      }
      .tag.event .dot { background: var(--primary); }

      /* Lower third: clear of the chat panel on the right; at the top when the subject is at the bottom. */
      .lower {
        position: absolute; left: 96px; bottom: 72px; max-width: 1150px;
        padding: calc(var(--space-5) * var(--film-scale)) calc(var(--space-6) * var(--film-scale));
        border-radius: var(--corner-2xl);
      }
      .lower.top { top: 120px; bottom: auto; }
      .lower .title {
        margin: 0;
        font-size: calc(var(--text-large-title-size) * var(--film-scale));
        line-height: calc(var(--text-large-title-leading) * var(--film-scale));
        font-weight: var(--text-large-title-weight);
      }
      .lower .subtitle {
        margin: calc(var(--space-1) * var(--film-scale)) 0 0;
        font-size: calc(var(--text-title-3-size) * var(--film-scale));
        line-height: calc(var(--text-title-3-leading) * var(--film-scale));
        font-weight: var(--text-title-3-weight);
        color: var(--muted-foreground);
      }

      /* Slate: a missing clip. Flat, neutral and dashed, so it can never pass for the app. */
      .slate { background: var(--muted); }
      .slate .frame {
        position: absolute; inset: 48px;
        border: 3px dashed var(--muted-foreground); border-radius: var(--corner-2xl);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 160px;
      }
      .slate .pending {
        margin: 0;
        font-size: calc(var(--text-large-title-size) * 2);
        line-height: calc(var(--text-large-title-leading) * 2);
        font-weight: var(--text-large-title-weight);
      }
      .slate .clip {
        margin: calc(var(--space-4) * var(--film-scale)) 0 0;
        font-family: var(--font-code);
        font-size: calc(var(--text-title-2-size) * var(--film-scale));
        line-height: calc(var(--text-title-2-leading) * var(--film-scale));
      }
      .slate .meta, .slate .shows, .slate .needs {
        margin: calc(var(--space-3) * var(--film-scale)) 0 0; max-width: 1280px;
        font-size: calc(var(--text-body-size) * var(--film-scale));
        line-height: calc(var(--text-body-leading) * var(--film-scale));
        color: var(--muted-foreground);
      }
      .slate .shows { color: var(--foreground); }
      .slate code { font-family: var(--font-code); }

      /* End slate. */
      .end { display: none; }
      .end.active { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .end .title {
        margin: 0;
        font-size: calc(var(--text-large-title-size) * 2.5);
        line-height: calc(var(--text-large-title-leading) * 2.5);
        font-weight: var(--text-large-title-weight);
      }
      .end .line {
        margin: calc(var(--space-3) * var(--film-scale)) 0 0;
        font-size: calc(var(--text-title-3-size) * var(--film-scale));
        line-height: calc(var(--text-title-3-leading) * var(--film-scale));
        color: var(--muted-foreground);
      }
      .end .link { color: var(--glass-accent-fg); }
    </style>
  </head>
  <body>
    <section class="card wash" data-card="backdrop"></section>
    <section class="card" data-card="tag">
      <div class="tag glass-strong" data-reveal="0"><span class="dot"></span><span data-text="tag"></span></div>
    </section>
    <section class="card" data-card="lower">
      <div class="lower glass-strong" data-reveal="0">
        <p class="title" data-text="title"></p>
        <p class="subtitle" data-text="subtitle"></p>
      </div>
    </section>
    <section class="card slate" data-card="slate">
      <div class="frame">
        <p class="pending">Footage pending</p>
        <p class="clip" data-text="clip"></p>
        <p class="meta" data-text="meta"></p>
        <p class="shows" data-text="shows"></p>
        <p class="needs" data-text="needs"></p>
      </div>
    </section>
    <section class="card end wash" data-card="end">
      <p class="title" data-reveal="0" data-text="title"></p>
      <div data-lines></div>
    </section>
    <script>
      const cards = [...document.querySelectorAll(".card")];
      const ease = (t) => 1 - (1 - Math.min(1, Math.max(0, t))) ** 3;
      const revealMs = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--duration-slow")) || 300;
      const rise = 8;

      /** Fill an element with text, drawing `code` spans as code and dropping Markdown bold. */
      function fill(element, text) {
        element.replaceChildren();
        String(text ?? "")
          .replace(/\*\*/g, "")
          .split("`")
          .forEach((part, index) => {
            if (index % 2 === 1) {
              const code = document.createElement("code");
              code.textContent = part;
              element.append(code);
            } else {
              element.append(part);
            }
          });
        element.hidden = element.textContent.length === 0;
      }

      window.setCard = (spec) => {
        for (const card of cards) card.classList.toggle("active", card.dataset.card === spec.kind);
        const card = document.querySelector(".card.active");
        const slot = (name) => card.querySelector(`[data-text="${name}"]`);
        if (spec.kind === "tag") {
          fill(slot("tag"), spec.text);
          card.querySelector(".tag").classList.toggle("event", Boolean(spec.event));
        }
        if (spec.kind === "lower") {
          fill(slot("title"), spec.lines[0]);
          fill(slot("subtitle"), spec.lines[1]);
          card.querySelector(".lower").classList.toggle("top", spec.position === "top");
        }
        if (spec.kind === "slate") {
          fill(slot("clip"), spec.clip);
          fill(slot("meta"), `${spec.time} in the script`);
          fill(slot("shows"), spec.shows);
          fill(slot("needs"), spec.needs ? `Needs: ${spec.needs}` : "");
        }
        if (spec.kind === "end") {
          fill(slot("title"), spec.title);
          const holder = card.querySelector("[data-lines]");
          holder.replaceChildren();
          const lines = [...(spec.lines ?? []), spec.link].filter(Boolean);
          lines.forEach((text, index) => {
            const line = document.createElement("p");
            line.className = text === spec.link ? "line link" : "line";
            line.dataset.reveal = String(150 * (index + 1));
            fill(line, text);
            holder.append(line);
          });
        }
        window.renderAt(0);
      };

      /** Milliseconds until the active card has settled; 0 for a still card. */
      window.cardLength = () => {
        const card = document.querySelector(".card.active");
        const starts = [...card.querySelectorAll("[data-reveal]")].map((element) => Number(element.dataset.reveal));
        return starts.length === 0 ? 0 : Math.max(...starts) + revealMs;
      };

      window.renderAt = (ms) => {
        const card = document.querySelector(".card.active");
        if (!card) return;
        for (const element of card.querySelectorAll("[data-reveal]")) {
          const p = ease((ms - Number(element.dataset.reveal)) / revealMs);
          element.style.opacity = String(p);
          element.style.transform = `translateY(${(1 - p) * rise}px)`;
        }
      };

      const params = new URLSearchParams(location.search);
      if (params.has("preview")) document.body.classList.add("preview");
      if (params.has("card")) {
        window.setCard({
          kind: params.get("card"),
          text: params.get("text") ?? "Built during the event",
          event: params.get("event") !== "0",
          lines: params.getAll("line").length > 0 ? params.getAll("line") : ["Plain warnings. Nothing lost."],
          position: params.get("position") ?? "bottom",
          clip: params.get("clip") ?? "shot-08-offline.mov",
          time: params.get("time") ?? "2:19–2:29",
          shows: params.get("shows") ?? "",
          needs: params.get("needs") ?? "",
          title: params.get("title") ?? "AI Book Studio"
        });
        window.renderAt(Number(params.get("at") ?? 10000));
      }
      window.cardsReady = true;
    </script>
  </body>
</html>
