appId: studio.aibook.app
productName: AI Book Studio
afterPack: ../../scripts/flip-fuses.mjs
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: ../../release
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Open Book Studio uses the microphone only while you dictate. The recording is sent to your selected model provider and is not saved.
win:
  target:
    - nsis
linux:
  category: Office
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
